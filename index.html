<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAD Code Library</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="menuBtn" class="icon-btn" aria-label="Open units menu">☰</button>
  <div class="brand"><h1>AAD Code Library</h1><p>SY BSc Computer Science | Advanced Application Development | Units 1–10</p></div>
  <div class="search">
    <input id="search" type="search" placeholder="Search unit, Q number, title, keyword, filename or code…  e.g. Unit 4 Q3, orderBy, login.js" autocomplete="off" aria-label="Search practicals">
    <button id="clearSearch" class="icon-btn" aria-label="Clear search" hidden>✕</button>
  </div>
</header>
<div class="layout">
  <aside id="sidebar" class="side">
    <nav>
      <button class="nav-item" data-unit="all"><span>All Units</span><b id="cnt-all"></b></button>
      <button class="nav-item" id="favNav" data-unit="fav"><span>★ Favourites</span><b id="cnt-fav">0</b></button>
      <div class="side-h">Units</div>
      <div id="unitList"></div>
      <div class="side-h">Recently viewed</div>
      <div id="recentList" class="recent"></div>
    </nav>
  </aside>
  <div id="scrim" class="scrim"></div>
  <main>
    <div class="toolbar">
      <span id="counter" class="counter"></span>
      <label class="chk"><input type="checkbox" id="favOnly"> Show favourites only</label>
      <button id="expandAll" class="btn">Expand All</button>
      <button id="collapseAll" class="btn">Collapse All</button>
    </div>
    <div id="cards"></div>
    <div id="empty" class="empty" hidden><h3>No matching codes found</h3><p>Try a unit (Unit 5), a question (Q2), a filename (login.js) or a keyword (Express, orderBy).</p></div>
  </main>
</div>
<button id="toTop" class="to-top" aria-label="Back to top" hidden>↑</button>
<div id="toast" class="toast" role="status">Code copied successfully!</div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
